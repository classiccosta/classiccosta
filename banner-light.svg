<svg xmlns="http://www.w3.org/2000/svg" width="480" height="62" viewBox="0 0 480 62">
  <style>
    .name { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .role { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .bubble-user { fill: #e8f5d6; }
    .bubble-ai { fill: #f1efe8; }
    .line { fill: #b4b2a9; }
    .dot { fill: #639922; animation: blink 1.4s infinite ease-in-out; }
    .d2 { animation-delay: .2s; }
    .d3 { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: 1; } }
  </style>
  <text x="-1.3" y="26" class="name">Diogo Costa</text>
  <text x="-0.9" y="48" class="role">Frontend engineer · React + TypeScript · AI interfaces</text>

  <rect x="384" y="6" width="94" height="20" rx="9" class="bubble-user"/>
  <rect x="394" y="13.5" width="58" height="5" rx="2.5" fill="#97c459"/>

  <rect x="358" y="33" width="68" height="20" rx="9" class="bubble-ai"/>
  <circle cx="373" cy="43" r="3" class="dot"/>
  <circle cx="383" cy="43" r="3" class="dot d2"/>
  <circle cx="393" cy="43" r="3" class="dot d3"/>
</svg>
