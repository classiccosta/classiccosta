<svg xmlns="http://www.w3.org/2000/svg" width="560" height="80" viewBox="0 0 560 80">
  <style>
    .name { font: 600 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .role { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9198a1; }
    .bubble-user { fill: #27500a; }
    .bubble-ai { fill: #2c2c2a; }
    .dot { fill: #97c459; animation: blink 1.4s infinite ease-in-out; }
    .d2 { animation-delay: .2s; }
    .d3 { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: 1; } }
  </style>
  <text x="0" y="34" class="name">Diogo Costa</text>
  <text x="0" y="58" class="role">Frontend engineer · React + TypeScript · AI interfaces</text>

  <rect x="440" y="10" width="110" height="24" rx="10" class="bubble-user"/>
  <rect x="452" y="19" width="70" height="6" rx="3" fill="#97c459"/>

  <rect x="410" y="42" width="80" height="24" rx="10" class="bubble-ai"/>
  <circle cx="428" cy="54" r="3.5" class="dot"/>
  <circle cx="440" cy="54" r="3.5" class="dot d2"/>
  <circle cx="452" cy="54" r="3.5" class="dot d3"/>
</svg>
